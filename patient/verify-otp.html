<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify OTP - Neolife</title>
<link rel="icon" href="../assets/main_logo.jpeg">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Segoe UI",sans-serif}

body{
  min-height:100vh;
  background:linear-gradient(135deg,#123524,#6f8f77);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.auth-card{
  width:100%;
  max-width:440px;
  padding:38px;
  background:rgba(255,255,255,0.18);
  border:1px solid rgba(255,255,255,0.35);
  border-radius:28px;
  text-align:center;
  color:white;
  box-shadow:0 20px 50px rgba(0,0,0,0.25);
}

.logo{
  width:85px;
  height:85px;
  border-radius:50%;
  margin-bottom:18px;
  border:3px solid #d4af37;
}

h1{
  font-size:32px;
  margin-bottom:10px;
}

p{
  font-size:15px;
  margin-bottom:24px;
}

.otp-box{
  display:flex;
  gap:10px;
  justify-content:center;
  margin-bottom:20px;
}

.otp-box input{
  width:48px;
  height:55px;
  text-align:center;
  font-size:22px;
  font-weight:800;
  border:none;
  border-radius:12px;
  outline:none;
}

button{
  width:100%;
  padding:16px;
  border:none;
  border-radius:30px;
  background:linear-gradient(135deg,#ffd86b,#d4af37);
  color:#123524;
  font-weight:800;
  cursor:pointer;
}

.resend{
  margin-bottom:18px;
  font-size:14px;
  color:#ffd86b;
  font-weight:700;
}

.link{
  margin-top:20px;
  font-size:14px;
}

.link a{
  color:#ffd86b;
  font-weight:800;
  text-decoration:none;
}
@media(max-width:1100px) and (min-width:701px){

  .home-glass-header{
    padding:8px 18px !important;
    column-gap:12px !important;
  }

  .home-logo-img{
    width:46px !important;
    height:46px !important;
  }

  .home-logo-text{
    font-size:15px !important;
  }

  .home-logo-subtitle{
    font-size:9px !important;
  }

  .home-header-right{
    gap:9px !important;
  }

  .home-navbar{
    gap:11px !important;
  }

  .home-navbar > a,
  .home-category-btn{
    font-size:11px !important;
    padding:6px 0 !important;
  }

  .home-login-btn,
  .home-register-btn,
  .logout-btn{
    min-height:37px !important;
    padding:7px 11px !important;
    font-size:11px !important;
  }

  .profile-icon{
    width:38px !important;
    height:38px !important;
    min-width:38px !important;
  }
}
</style>
</head>

<body>

<div class="auth-card">
  <img src="../assets/pro_logo.jpeg" class="logo" alt="Neolife Logo">

  <h1>Verify OTP</h1>
  <p>A 6-digit code has been sent to your email.</p>

  <div class="otp-box">
    <input maxlength="1" oninput="moveNext(this,0)">
    <input maxlength="1" oninput="moveNext(this,1)">
    <input maxlength="1" oninput="moveNext(this,2)">
    <input maxlength="1" oninput="moveNext(this,3)">
    <input maxlength="1" oninput="moveNext(this,4)">
    <input maxlength="1" oninput="moveNext(this,5)">
  </div>

  <div class="resend" id="timer">Resend OTP in 30s</div>

  <button onclick="verifyOTP()">Verify OTP</button>

  <div class="link">
    <a href="forgot-password.html">Change Email Address</a>
  </div>
</div>

<script>
const API_BASE_URL="/api";
const inputs=document.querySelectorAll(".otp-box input");
const timer=document.getElementById("timer");
let time=30;

function moveNext(input,index){
 input.value=input.value.replace(/\D/g,"");
 if(input.value && index<inputs.length-1) inputs[index+1].focus();
}
inputs.forEach((i,idx)=>{
 i.addEventListener("keydown",e=>{
   if(e.key==="Backspace"&&!i.value&&idx>0) inputs[idx-1].focus();
   if(e.key==="Enter") verifyOTP();
 });
});

async function verifyOTP(){
 const code=[...inputs].map(i=>i.value).join("");
 const email=localStorage.getItem("resetEmail");
 if(code.length!==6){alert("Enter 6 digit code");return;}
 const btn=document.querySelector("button");
 btn.disabled=true;btn.textContent="Verifying...";
 try{
  const r=await fetch(API_BASE_URL+"/auth/verify-reset-code",{
    method:"POST",
    headers:{"Content-Type":"application/json","Accept":"application/json"},
    body:JSON.stringify({email:email,code:Number(code)})
  });
  const res=await r.json();
  if(!r.ok||res.success===false) throw new Error(res.message||"Verification failed");
  localStorage.setItem("resetSessionToken",res.data.resetSessionToken);
  alert("Verification successful");
  location.href="reset-password.html";
 }catch(e){
  alert(e.message);
 }finally{
  btn.disabled=false;btn.textContent="Verify OTP";
 }
}

const countdown=setInterval(()=>{
 time--;
 timer.innerText="Resend OTP in "+time+"s";
 if(time<=0){
   clearInterval(countdown);
   timer.innerHTML='<span style="cursor:pointer" onclick="resendOTP()">Resend Code</span>';
 }
},1000);

async function resendOTP(){
 const email=localStorage.getItem("resetEmail");
 try{
  const r=await fetch(API_BASE_URL+"/auth/forgot-password",{
   method:"POST",
   headers:{"Content-Type":"application/json","Accept":"application/json"},
   body:JSON.stringify({email})
  });
  const res=await r.json();
  if(!r.ok||res.success===false) throw new Error(res.message||"Unable to resend");
  alert("Verification code sent.");
  location.reload();
 }catch(e){alert(e.message);}
}
</script>

</body>
</html>
