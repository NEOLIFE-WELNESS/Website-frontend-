<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Patient Register - Neolife Wellness Center</title>

  <link rel="icon" type="image/jpeg" href="../assets/main_logo.jpeg">
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

  <style>
    :root{
      --green-950:#0d281b;
      --green-900:#123524;
      --green-700:#2f6b3f;
      --green-500:#5c8b61;
      --sage:#dfeadd;
      --cream:#f8f4e8;
      --gold:#d4af37;
      --gold-dark:#9a7100;
      --white:#ffffff;
      --text:#203329;
      --muted:#6d7971;
      --shadow:0 26px 70px rgba(13,40,27,.28);
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
      font-family:"Segoe UI", Arial, sans-serif;
    }

    body{
      min-height:100vh;
      color:var(--text);
      background:
        linear-gradient(rgba(13,40,27,.64),rgba(13,40,27,.68)),
        url("../assets/neolife2.png") center/cover no-repeat fixed;
      position:relative;
      overflow-x:hidden;
    }

    body::before{
      content:"";
      position:fixed;
      inset:0;
      background:
        radial-gradient(circle at 20% 18%,rgba(212,175,55,.18),transparent 28%),
        radial-gradient(circle at 82% 74%,rgba(255,255,255,.10),transparent 30%);
      pointer-events:none;
    }

    /* Top navigation */
    .register-header{
      position:fixed;
      top:0;
      left:0;
      right:0;
      height:82px;
      padding:0 6%;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:30px;
      z-index:1000;
      background:rgba(13,40,27,.44);
      backdrop-filter:blur(12px);
      border-bottom:1px solid rgba(255,255,255,.12);
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      color:white;
      text-decoration:none;
      flex-shrink:0;
    }

    .brand img{
      width:52px;
      height:52px;
      object-fit:cover;
      border-radius:50%;
      border:2px solid var(--gold);
    }

    .brand strong{
      display:block;
      font-size:18px;
      line-height:1.1;
    }

    .brand span{
      display:block;
      margin-top:4px;
      color:#f1d878;
      font-size:11px;
      font-weight:800;
      letter-spacing:1.2px;
      text-transform:uppercase;
    }

    .register-nav{
      display:flex;
      align-items:center;
      gap:28px;
    }

    .register-nav a{
      color:white;
      text-decoration:none;
      font-size:14px;
      font-weight:800;
    }

    .register-nav a:hover{
      color:#f1d878;
    }

    .nav-register{
      padding:10px 20px;
      border-radius:10px;
      border:1px solid rgba(255,255,255,.75);
    }

    /* Page */
    .register-page{
      min-height:100vh;
      padding:118px 20px 40px;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .register-shell{
      width:min(760px,100%);
      position:relative;
    }

    .register-card{
      width:100%;
      padding:38px 40px 34px;
      border-radius:28px;
      background:rgba(248,244,232,.84);
      backdrop-filter:blur(24px);
      border:1px solid rgba(255,255,255,.62);
      box-shadow:var(--shadow);
      position:relative;
      overflow:hidden;
    }

    .register-card::before{
      content:"";
      position:absolute;
      width:260px;
      height:260px;
      right:-105px;
      top:-105px;
      border-radius:50%;
      background:rgba(212,175,55,.13);
    }

    .register-card::after{
      content:"";
      position:absolute;
      width:190px;
      height:190px;
      left:-90px;
      bottom:-95px;
      border-radius:50%;
      background:rgba(47,107,63,.10);
    }

    .close-button{
      position:absolute;
      top:16px;
      right:16px;
      width:36px;
      height:36px;
      display:grid;
      place-items:center;
      border-radius:50%;
      color:white;
      background:var(--green-900);
      text-decoration:none;
      z-index:3;
      box-shadow:0 8px 18px rgba(13,40,27,.18);
    }

    .register-content{
      position:relative;
      z-index:2;
    }

    .auth-logo{
      width:78px;
      height:78px;
      object-fit:cover;
      border-radius:50%;
      border:3px solid var(--gold);
      display:block;
      margin:0 auto 14px;
      background:white;
      box-shadow:0 10px 24px rgba(13,40,27,.18);
    }

    .register-card h2{
      text-align:center;
      color:var(--green-900);
      font-size:32px;
      line-height:1.15;
      margin-bottom:7px;
    }

    .register-card > .register-content > p{
      text-align:center;
      color:var(--muted);
      font-size:14px;
      margin-bottom:24px;
    }

    .form-row{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:14px;
    }

    .form-group{
      margin-bottom:14px;
    }

    .form-group input,
    .form-group select{
      width:100%;
      height:52px;
      padding:0 16px;
      border:none;
      border-bottom:2px solid rgba(13,40,27,.46);
      border-radius:10px 10px 0 0;
      outline:none;
      background:rgba(255,255,255,.55);
      color:var(--text);
      font-size:15px;
      transition:.25s;
    }

    .form-group input::placeholder{
      color:#7f8a83;
    }

    .form-group select{
      cursor:pointer;
    }

    .form-group input:focus,
    .form-group select:focus{
      background:rgba(255,255,255,.9);
      border-bottom-color:var(--gold-dark);
      box-shadow:0 8px 18px rgba(13,40,27,.06);
    }

    .register-btn{
      width:100%;
      height:52px;
      margin-top:5px;
      border:none;
      border-radius:10px;
      color:white;
      background:linear-gradient(135deg,var(--green-900),var(--green-700));
      font-size:15px;
      font-weight:900;
      cursor:pointer;
      transition:.3s;
      box-shadow:0 10px 24px rgba(13,40,27,.20);
    }

    .register-btn:hover{
      transform:translateY(-3px);
      background:linear-gradient(135deg,var(--gold),var(--gold-dark));
    }

    .auth-link{
      margin-top:20px !important;
      text-align:center;
      color:var(--muted) !important;
      font-size:14px !important;
    }

    .auth-link a{
      color:var(--green-900);
      font-weight:900;
      text-decoration:none;
    }

    .auth-link a:hover{
      color:var(--gold-dark);
    }

    .form-note{
      display:flex;
      align-items:center;
      gap:8px;
      margin:4px 0 18px;
      color:var(--muted);
      font-size:12px;
    }

    .form-note i{
      color:var(--gold-dark);
    }

    @media(max-width:780px){
      .register-header{
        padding:0 20px;
      }

      .register-nav{
        gap:15px;
      }

      .register-nav a:not(.nav-register){
        display:none;
      }
    }

    @media(max-width:620px){
      .register-page{
        padding:105px 12px 22px;
      }

      .register-card{
        padding:34px 22px 28px;
        border-radius:22px;
      }

      .form-row{
        grid-template-columns:1fr;
        gap:0;
      }

      .register-card h2{
        font-size:28px;
      }
    }
    @media(max-width:1100px) and (min-width:701px){

  .home-glass-header{
    padding:8px 18px !important;
    column-gap:12px !important;
  }

  .home-logo-img{
    width:46px !important;
    height:46px !important;
  }

  .home-logo-text{
    font-size:15px !important;
  }

  .home-logo-subtitle{
    font-size:9px !important;
  }

  .home-header-right{
    gap:9px !important;
  }

  .home-navbar{
    gap:11px !important;
  }

  .home-navbar > a,
  .home-category-btn{
    font-size:11px !important;
    padding:6px 0 !important;
  }

  .home-login-btn,
  .home-register-btn,
  .logout-btn{
    min-height:37px !important;
    padding:7px 11px !important;
    font-size:11px !important;
  }

  .profile-icon{
    width:38px !important;
    height:38px !important;
    min-width:38px !important;
  }
}
  
    .register-btn:disabled{opacity:.72;cursor:not-allowed;transform:none}
    .form-message{display:none;margin:0 0 14px;padding:11px 13px;border-radius:10px;font-size:13px;font-weight:700}
    .form-message.show{display:block}
    .form-message.error{color:#8b1e16;background:#fde8e6;border:1px solid #efb7b2}
    .form-message.success{color:#14532d;background:#e8f7ed;border:1px solid #b7dfc3}
</style>
</head>

<body>

<header class="register-header">

  <a href="homepage.html" class="brand">
    <img src="../assets/main_logo.jpeg" alt="Neolife Logo">

    <div>
      <strong>Neolife Wellness Center</strong>
      <span>Ayush Digital Care</span>
    </div>
  </a>

  <nav class="register-nav">
    <a href="homepage.html">Home</a>
    <a href="about.html">About</a>
    <a href="services.html">Therapies</a>
    <a href="beauty-cosmetics.html">Beauty</a>
    <a href="contact.html">Contact</a>
    <a href="register.html" class="nav-register">Register</a>
  </nav>

</header>

<main class="register-page">

  <div class="register-shell">

    <div class="register-card">

      <a href="homepage.html" class="close-button" aria-label="Close">
        <i class="fa-solid fa-xmark"></i>
      </a>

      <div class="register-content">

        <img src="../assets/main_logo.jpeg"
             class="auth-logo"
             alt="Neolife Logo">

        <h2>Patient Registration</h2>

        <p>Create your account to access consultations and wellness services.</p>

        <form id="registerForm" onsubmit="return registerUser(event)">

          <div id="registerMessage" class="form-message"></div>

          <div class="form-group">
            <input type="text"
                   id="name"
                   placeholder="Full Name"
                   autocomplete="name"
                   minlength="2"
                   maxlength="100"
                   required>
          </div>

          <div class="form-row">

            <div class="form-group">
              <input type="tel"
                     id="phoneNumber"
                     placeholder="Phone Number"
                     autocomplete="tel"
                     inputmode="numeric"
                     maxlength="10"
                     oninput="this.value=this.value.replace(/[^0-9]/g,'')"
                     required>
            </div>

            <div class="form-group">
              <input type="email"
                     id="email"
                     placeholder="Email Address"
                     autocomplete="email"
                     maxlength="150"
                     required>
            </div>

          </div>

          <div class="form-row">

            <div class="form-group">
              <input type="number"
                     id="age"
                     placeholder="Age"
                     min="1"
                     max="120"
                     required>
            </div>

            <div class="form-group">
              <select id="gender" required>
                <option value="">Select Gender</option>
                <option value="MALE">Male</option>
                <option value="FEMALE">Female</option>
                <option value="OTHER">Other</option>
              </select>
            </div>

          </div>

          <div class="form-group">
            <input type="password"
                   id="password"
                   placeholder="Create Password"
                   autocomplete="new-password"
                   minlength="8"
                   maxlength="72"
                   required>
          </div>

          <div class="form-group">
            <input type="password"
                   id="confirmPassword"
                   placeholder="Confirm Password"
                   autocomplete="new-password"
                   minlength="8"
                   maxlength="72"
                   required>
          </div>

          <div class="form-note">
            <i class="fa-solid fa-shield-heart"></i>
            Your account information is used only for Neolife services.
          </div>

          <button type="submit" class="register-btn" id="registerButton">
            Create Account
          </button>

        </form>

        <p class="auth-link">
          Already have an account?
          <a href="login.html">Login here</a>
        </p>

      </div>

    </div>

  </div>

</main>

<script>
const API_BASE_URL = "http://localhost:8085";

document.addEventListener(
  "DOMContentLoaded",
  function () {
    /*
     * A logged-in user should not remain on
     * the registration page.
     */
    const token =
      localStorage.getItem("token");

    const role =
      localStorage.getItem("role");

    if (token && role) {
      redirectLoggedInUser(
        role,
        localStorage.getItem(
          "profileCompleted"
        ) === "true"
      );
    }
  }
);

function showRegisterMessage(
  message,
  type = "error"
) {
  const box =
    document.getElementById(
      "registerMessage"
    );

  if (!box) {
    alert(message);
    return;
  }

  box.textContent = message;
  box.className =
    `form-message show ${type}`;
}

function clearRegisterMessage() {
  const box =
    document.getElementById(
      "registerMessage"
    );

  if (!box) {
    return;
  }

  box.textContent = "";
  box.className = "form-message";
}

function redirectLoggedInUser(
  role,
  profileCompleted
) {
  const normalizedRole =
    String(role || "USER")
      .toUpperCase();

  switch (normalizedRole) {
    case "ADMIN":
      window.location.replace(
        "../admin/admin-dashboard.html"
      );
      break;

    case "DOCTOR":
      window.location.replace(
        profileCompleted
          ? "../doctor/doctor-dashboard.html"
          : "../doctor/doctor-profile.html"
      );
      break;

    case "MEDICAL_STAFF":
      window.location.replace(
        profileCompleted
          ? "../medical/staff-dashboard.html"
          : "../medical/profile.html"
      );
      break;

    case "THERAPIST":
      window.location.replace(
        profileCompleted
          ? "../therapist/therapist-dashboard.html"
          : "../therapist/therapist-profile.html"
      );
      break;

    case "USER":
    default:
      window.location.replace(
        "profile.html"
      );
      break;
  }
}

async function safelyReadResponse(
  response
) {
  const responseText =
    await response.text();

  if (!responseText) {
    return {};
  }

  try {
    return JSON.parse(
      responseText
    );
  } catch {
    return {
      success: false,
      message:
        responseText ||
        `Invalid server response (${response.status}).`
    };
  }
}

function getRegistrationPayload() {
  return {
    name:
      document
        .getElementById("name")
        .value
        .trim(),

    phoneNumber:
      document
        .getElementById(
          "phoneNumber"
        )
        .value
        .trim(),

    email:
      document
        .getElementById("email")
        .value
        .trim()
        .toLowerCase(),

    age:
      Number(
        document
          .getElementById("age")
          .value
      ),

    gender:
      document
        .getElementById("gender")
        .value,

    password:
      document
        .getElementById("password")
        .value,

    confirmPassword:
      document
        .getElementById(
          "confirmPassword"
        )
        .value
  };
}

function validateRegistration(
  payload
) {
  if (
    !payload.name ||
    !payload.phoneNumber ||
    !payload.email ||
    !payload.age ||
    !payload.gender ||
    !payload.password ||
    !payload.confirmPassword
  ) {
    showRegisterMessage(
      "Please fill in all fields."
    );
    return false;
  }

  if (
    payload.name.length < 2
  ) {
    showRegisterMessage(
      "Full name must contain at least 2 characters."
    );

    document
      .getElementById("name")
      .focus();

    return false;
  }

  if (
    !/^[A-Za-zÀ-ž.'\-\s]+$/.test(
      payload.name
    )
  ) {
    showRegisterMessage(
      "Please enter a valid full name."
    );

    document
      .getElementById("name")
      .focus();

    return false;
  }

  if (
    !/^[6-9][0-9]{9}$/.test(
      payload.phoneNumber
    )
  ) {
    showRegisterMessage(
      "Enter a valid 10-digit Indian mobile number."
    );

    document
      .getElementById(
        "phoneNumber"
      )
      .focus();

    return false;
  }

  const emailPattern =
    /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

  if (
    !emailPattern.test(
      payload.email
    )
  ) {
    showRegisterMessage(
      "Please enter a valid email address."
    );

    document
      .getElementById("email")
      .focus();

    return false;
  }

  if (
    !Number.isInteger(
      payload.age
    ) ||
    payload.age < 1 ||
    payload.age > 120
  ) {
    showRegisterMessage(
      "Please enter a valid age between 1 and 120."
    );

    document
      .getElementById("age")
      .focus();

    return false;
  }

  /*
   * Backend example uses passwords such as Yogesh@123.
   * Require at least 8 characters, one uppercase,
   * one lowercase, one number and one special character.
   */
  const passwordPattern =
    /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,72}$/;

  if (
    !passwordPattern.test(
      payload.password
    )
  ) {
    showRegisterMessage(
      "Password must contain at least 8 characters, including uppercase, lowercase, number and special character."
    );

    document
      .getElementById("password")
      .focus();

    return false;
  }

  if (
    payload.password !==
    payload.confirmPassword
  ) {
    showRegisterMessage(
      "Password and confirm password do not match."
    );

    document
      .getElementById(
        "confirmPassword"
      )
      .focus();

    return false;
  }

  return true;
}

async function registerUser(event) {
  event.preventDefault();
  clearRegisterMessage();

  const payload =
    getRegistrationPayload();

  if (
    !validateRegistration(
      payload
    )
  ) {
    return false;
  }

  const button =
    document.getElementById(
      "registerButton"
    ) ||
    event.submitter;

  const originalButtonHtml =
    button
      ? button.innerHTML
      : "Create Account";

  if (button) {
    button.disabled = true;
    button.innerHTML = `
      <i class="fa-solid fa-spinner fa-spin"></i>
      Creating Account...
    `;
  }

  try {
    const response =
      await fetch(
        `${API_BASE_URL}/api/auth/register`,
        {
          method: "POST",
          headers: {
            "Content-Type":
              "application/json",
            Accept:
              "application/json"
          },
          body:
            JSON.stringify(
              payload
            )
        }
      );

    const result =
      await safelyReadResponse(
        response
      );

    if (
      !response.ok ||
      result.success === false
    ) {
      throw new Error(
        result.message ||
        "Registration failed."
      );
    }

    /*
     * The registration response does not return a login token,
     * so redirect the new patient to the login page.
     */
    localStorage.setItem(
      "registeredEmail",
      payload.email
    );

    showRegisterMessage(
      result.message ||
      "Registration successful. Redirecting to login...",
      "success"
    );

    document
      .getElementById(
        "registerForm"
      )
      .reset();

    setTimeout(
      function () {
        window.location.replace(
          "login.html"
        );
      },
      1000
    );

  } catch (error) {
    console.error(
      "Registration failed:",
      error
    );

    showRegisterMessage(
      error.message ||
      "Unable to connect to the server. Make sure Spring Boot is running on port 8085."
    );

  } finally {
    if (button) {
      button.disabled = false;
      button.innerHTML =
        originalButtonHtml;
    }
  }

  return false;
}
</script>
</body>
</html>
