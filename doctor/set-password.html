<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Set Password - Neolife Wellness Center</title>

    <link
        rel="icon"
        type="image/jpeg"
        href="../assets/main_logo.jpeg"
    >

    <style>
        :root {
            --dark-green: #153d29;
            --green: #2d6844;
            --cream: #f6f8f4;
            --white: #ffffff;
            --text: #173c29;
            --muted: #6e7871;
            --border: #dfe7e1;
            --success: #287146;
            --success-light: #ebf7ef;
            --danger: #c74747;
            --danger-light: #fff0f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            padding: 25px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: var(--text);
            background:
                linear-gradient(
                    135deg,
                    #f6f8f4,
                    #edf5ef
                );
        }

        button,
        input {
            font: inherit;
        }

        .password-card {
            width: 100%;
            max-width: 470px;
            padding: 34px;

            border: 1px solid var(--border);
            border-radius: 22px;

            background: var(--white);

            box-shadow:
                0 18px 45px rgba(21, 61, 41, 0.12);
        }

        .logo-box {
            margin-bottom: 22px;

            display: flex;
            align-items: center;
            gap: 13px;
        }

        .logo-box img {
            width: 58px;
            height: 58px;

            object-fit: cover;

            border: 2px solid #c99a16;
            border-radius: 50%;
        }

        .logo-text h2 {
            margin-bottom: 4px;

            color: var(--dark-green);
            font-size: 18px;
            font-weight: 800;
        }

        .logo-text span {
            color: #9b7200;
            font-size: 11px;
            font-weight: 700;
        }

        .password-card h1 {
            margin-bottom: 9px;

            color: var(--dark-green);
            font-size: 28px;
            font-weight: 800;
        }

        .description {
            margin-bottom: 24px;

            color: var(--muted);
            font-size: 14px;
            line-height: 1.7;
        }

        .message {
            display: none;

            margin-bottom: 18px;
            padding: 13px 14px;

            border-radius: 10px;

            font-size: 13px;
            line-height: 1.6;
        }

        .message.success {
            display: block;

            color: var(--success);
            background: var(--success-light);
            border: 1px solid #cce7d5;
        }

        .message.error {
            display: block;

            color: var(--danger);
            background: var(--danger-light);
            border: 1px solid #f0cccc;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;

            margin-bottom: 8px;

            color: var(--dark-green);
            font-size: 13px;
            font-weight: 800;
        }

        .input-wrapper {
            position: relative;
        }

        .form-group input {
            width: 100%;
            min-height: 47px;
            padding: 12px 43px 12px 14px;

            border: 1px solid var(--border);
            border-radius: 11px;

            color: var(--text);
            background: var(--white);

            font-size: 14px;

            outline: none;
            transition: 0.25s;
        }

        .form-group input:focus {
            border-color: var(--green);

            box-shadow:
                0 0 0 3px rgba(45, 104, 68, 0.10);
        }

        .toggle-password {
            width: 40px;
            height: 40px;

            position: absolute;
            top: 50%;
            right: 4px;

            border: none;

            color: var(--muted);
            background: transparent;

            font-size: 17px;
            cursor: pointer;

            transform: translateY(-50%);
        }

        .password-help {
            margin-top: 7px;

            color: var(--muted);
            font-size: 11px;
            line-height: 1.5;
        }

        .submit-btn {
            width: 100%;
            min-height: 48px;
            margin-top: 4px;

            border: none;
            border-radius: 11px;

            color: var(--white);
            background: var(--dark-green);

            font-size: 14px;
            font-weight: 800;

            cursor: pointer;
            transition: 0.25s;
        }

        .submit-btn:hover {
            background: var(--green);
        }

        .submit-btn:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .login-link {
            margin-top: 20px;

            color: var(--muted);

            text-align: center;
            font-size: 13px;
        }

        .login-link a {
            color: var(--dark-green);
            font-weight: 800;
            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        @media (max-width: 520px) {
            body {
                padding: 15px;
            }

            .password-card {
                padding: 26px 21px;
            }

            .password-card h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <main class="password-card">

        <div class="logo-box">

            <img
                src="../assets/main_logo.jpeg"
                alt="Neolife Wellness Center"
            >

            <div class="logo-text">
                <h2>Neolife Wellness Center</h2>
                <span>Doctor Account Setup</span>
            </div>

        </div>

        <h1>Set Your Password</h1>

        <p class="description">
            Enter the setup token received through email and create your
            account password.
        </p>

        <div
            id="messageBox"
            class="message"
        ></div>

        <form id="setPasswordForm">

            <div class="form-group">

                <label for="setupToken">
                    Reset / Setup Token
                </label>

                <input
                    type="text"
                    id="setupToken"
                    placeholder="Paste your setup token"
                    autocomplete="off"
                    required
                >

                <p class="password-help">
                    You may paste either the token or the complete setup link.
                </p>

            </div>

            <div class="form-group">

                <label for="newPassword">
                    New Password
                </label>

                <div class="input-wrapper">

                    <input
                        type="password"
                        id="newPassword"
                        placeholder="Enter new password"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        onclick="togglePassword('newPassword', this)"
                        aria-label="Show password"
                    >
                        👁
                    </button>

                </div>

                <p class="password-help">
                    Password must contain at least 8 characters.
                </p>

            </div>

            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <div class="input-wrapper">

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm new password"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        onclick="togglePassword('confirmPassword', this)"
                        aria-label="Show password"
                    >
                        👁
                    </button>

                </div>

            </div>

            <button
                type="submit"
                id="submitBtn"
                class="submit-btn"
            >
                Set Password
            </button>

        </form>

        <div class="login-link">
            Already set your password?
            <a href="../patient/login.html">
                Login here
            </a>
        </div>

    </main>

    <script>
        const API_BASE_URL = "http://localhost:8085";

        const setPasswordForm =
            document.getElementById("setPasswordForm");

        const setupTokenInput =
            document.getElementById("setupToken");

        const newPasswordInput =
            document.getElementById("newPassword");

        const confirmPasswordInput =
            document.getElementById("confirmPassword");

        const submitBtn =
            document.getElementById("submitBtn");

        const messageBox =
            document.getElementById("messageBox");


        /*
         * Read token automatically from URL:
         *
         * set-password.html?token=xxxxx
         */
        document.addEventListener("DOMContentLoaded", function () {

            const urlParameters =
                new URLSearchParams(window.location.search);

            const tokenFromUrl =
                urlParameters.get("token");

            if (tokenFromUrl) {
                setupTokenInput.value = tokenFromUrl.trim();
            }

        });


        function showMessage(message, type) {

            messageBox.textContent = message;
            messageBox.className = `message ${type}`;

            messageBox.scrollIntoView({
                behavior: "smooth",
                block: "nearest"
            });
        }


        function clearMessage() {

            messageBox.textContent = "";
            messageBox.className = "message";
        }


        function togglePassword(inputId, button) {

            const input =
                document.getElementById(inputId);

            if (input.type === "password") {

                input.type = "text";
                button.textContent = "🙈";
                button.setAttribute(
                    "aria-label",
                    "Hide password"
                );

            } else {

                input.type = "password";
                button.textContent = "👁";
                button.setAttribute(
                    "aria-label",
                    "Show password"
                );
            }
        }


        /*
         * Supports both:
         *
         * 1. Only token:
         *    f55c9c2a-xxxx
         *
         * 2. Full URL:
         *    http://127.0.0.1:5500/doctor/set-password.html?token=f55c9c2a
         */
        function extractSetupToken(value) {

            const enteredValue = value.trim();

            if (!enteredValue) {
                return "";
            }

            if (
                enteredValue.startsWith("http://") ||
                enteredValue.startsWith("https://")
            ) {

                try {

                    const setupUrl =
                        new URL(enteredValue);

                    return (
                        setupUrl.searchParams.get("token") ||
                        setupUrl.searchParams.get("resetToken") ||
                        ""
                    ).trim();

                } catch (error) {

                    console.error(
                        "Invalid setup URL:",
                        error
                    );

                    return "";
                }
            }

            return enteredValue;
        }


        async function safelyReadResponse(response) {

            const responseText =
                await response.text();

            if (!responseText) {
                return null;
            }

            try {

                return JSON.parse(responseText);

            } catch (error) {

                console.error(
                    "Response is not valid JSON:",
                    responseText
                );

                return {
                    success: false,
                    message: responseText
                };
            }
        }


        setPasswordForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();
                clearMessage();

                const setupToken =
                    extractSetupToken(
                        setupTokenInput.value
                    );

                const newPassword =
                    newPasswordInput.value;

                const confirmPassword =
                    confirmPasswordInput.value;


                if (!setupToken) {

                    showMessage(
                        "Please enter a valid setup token or setup link.",
                        "error"
                    );

                    setupTokenInput.focus();
                    return;
                }


                if (!newPassword) {

                    showMessage(
                        "Please enter your new password.",
                        "error"
                    );

                    newPasswordInput.focus();
                    return;
                }


                if (newPassword.length < 8) {

                    showMessage(
                        "Password must contain at least 8 characters.",
                        "error"
                    );

                    newPasswordInput.focus();
                    return;
                }


                if (!confirmPassword) {

                    showMessage(
                        "Please confirm your new password.",
                        "error"
                    );

                    confirmPasswordInput.focus();
                    return;
                }


                if (newPassword !== confirmPassword) {

                    showMessage(
                        "New password and confirm password do not match.",
                        "error"
                    );

                    confirmPasswordInput.focus();
                    return;
                }


                submitBtn.disabled = true;
                submitBtn.textContent =
                    "Setting Password...";


                try {

                    const response = await fetch(
                        `${API_BASE_URL}/api/auth/set-password`,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json",
                                "Accept":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                token: setupToken,
                                newPassword: newPassword,
                                confirmPassword:
                                    confirmPassword
                            })
                        }
                    );


                    const result =
                        await safelyReadResponse(response);


                    if (!response.ok) {

                        if (response.status === 400) {

                            throw new Error(
                                result?.message ||
                                "The setup token or password details are invalid."
                            );
                        }


                        if (response.status === 401) {

                            throw new Error(
                                result?.message ||
                                "The setup token is invalid or has expired."
                            );
                        }


                        if (response.status === 403) {

                            throw new Error(
                                result?.message ||
                                "The set-password API is blocked by Spring Security. Allow /api/auth/set-password without authentication."
                            );
                        }


                        if (response.status === 404) {

                            throw new Error(
                                result?.message ||
                                "Set-password API was not found."
                            );
                        }


                        if (response.status >= 500) {

                            throw new Error(
                                result?.message ||
                                "Server error occurred while setting the password."
                            );
                        }


                        throw new Error(
                            result?.message ||
                            `Request failed with status ${response.status}.`
                        );
                    }


                    if (
                        result &&
                        result.success === false
                    ) {

                        throw new Error(
                            result.message ||
                            "Unable to set password."
                        );
                    }


                    showMessage(
                        result?.message ||
                        "Password set successfully. Redirecting to login...",
                        "success"
                    );


                    localStorage.removeItem(
                        "temporarySetupToken"
                    );


                    setPasswordForm.reset();


                    setTimeout(function () {

                        window.location.href =
                            "../patient/login.html";

                    }, 1800);


                } catch (error) {

                    console.error(
                        "Set password error:",
                        error
                    );

                    showMessage(
                        error.message ||
                        "Unable to set password. Please try again.",
                        "error"
                    );


                } finally {

                    submitBtn.disabled = false;

                    submitBtn.textContent =
                        "Set Password";
                }
            }
        );
    </script>

</body>
</html>
