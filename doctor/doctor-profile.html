<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Complete Doctor Profile - Neolife Wellness Center</title>

    <link
        rel="icon"
        type="image/jpeg"
        href="../assets/main_logo.jpeg"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    >

    <style>
        :root {
            --dark-green: #153d29;
            --green: #2d6844;
            --green-light: #edf5ef;
            --gold: #c99a16;
            --gold-dark: #9b7200;
            --cream: #f6f8f4;
            --white: #ffffff;
            --text: #173c29;
            --muted: #6e7871;
            --border: #dfe7e1;
            --success: #287146;
            --success-light: #ebf7ef;
            --danger: #c74747;
            --danger-light: #fff0f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            color: var(--text);
            background: var(--cream);
        }

        button,
        input,
        textarea {
            font: inherit;
        }

        .page-wrapper {
            min-height: 100vh;
            padding: 30px 20px;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .profile-card {
            width: 100%;
            max-width: 850px;

            overflow: hidden;

            border: 1px solid var(--border);
            border-radius: 24px;

            background: var(--white);

            box-shadow:
                0 18px 50px rgba(21, 61, 41, 0.12);
        }

        .profile-header {
            padding: 30px;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;

            color: var(--white);
            background:
                linear-gradient(
                    120deg,
                    var(--dark-green),
                    #347650
                );
        }

        .brand-box {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .brand-box img {
            width: 66px;
            height: 66px;

            object-fit: cover;

            border: 2px solid var(--gold);
            border-radius: 50%;

            background: var(--white);
        }

        .brand-text h1 {
            margin-bottom: 6px;

            font-size: 27px;
            font-weight: 800;
        }

        .brand-text p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 13px;
            line-height: 1.6;
        }

        .header-icon {
            width: 62px;
            height: 62px;

            display: flex;
            align-items: center;
            justify-content: center;

            flex-shrink: 0;

            border-radius: 17px;

            color: #ffe28b;
            background: rgba(255, 255, 255, 0.1);

            font-size: 27px;
        }

        .profile-content {
            padding: 30px;
        }

        .message {
            display: none;

            margin-bottom: 20px;
            padding: 13px 15px;

            border-radius: 10px;

            font-size: 13px;
            line-height: 1.6;
        }

        .message.success {
            display: block;

            color: var(--success);
            background: var(--success-light);
            border: 1px solid #cce7d5;
        }

        .message.error {
            display: block;

            color: var(--danger);
            background: var(--danger-light);
            border: 1px solid #f0cccc;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
        }

        .form-group {
            margin-bottom: 3px;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        .form-group label {
            display: block;

            margin-bottom: 8px;

            color: var(--dark-green);
            font-size: 13px;
            font-weight: 800;
        }

        .required {
            color: var(--danger);
        }

        .form-control {
            width: 100%;
            min-height: 47px;
            padding: 12px 14px;

            border: 1px solid var(--border);
            border-radius: 11px;

            color: var(--text);
            background: var(--white);

            outline: none;
            transition: 0.25s;
        }

        .form-control:focus {
            border-color: var(--green);

            box-shadow:
                0 0 0 3px rgba(45, 104, 68, 0.1);
        }

        textarea.form-control {
            min-height: 125px;
            resize: vertical;
            line-height: 1.6;
        }

        .help-text {
            margin-top: 6px;

            color: var(--muted);
            font-size: 11px;
            line-height: 1.5;
        }

        .action-row {
            margin-top: 26px;

            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .btn {
            min-height: 46px;
            padding: 12px 19px;

            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;

            border: none;
            border-radius: 11px;

            font-size: 13px;
            font-weight: 800;

            cursor: pointer;
            transition: 0.25s;
        }

        .btn-primary {
            color: var(--white);
            background: var(--dark-green);
        }

        .btn-primary:hover {
            background: var(--green);
        }

        .btn-secondary {
            color: var(--dark-green);
            background: var(--green-light);
        }

        .btn-secondary:hover {
            background: #dceade;
        }

        .btn:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        @media (max-width: 720px) {
            .profile-header {
                align-items: flex-start;
            }

            .header-icon {
                display: none;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full-width {
                grid-column: auto;
            }

            .action-row {
                flex-direction: column-reverse;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <main class="page-wrapper">

        <section class="profile-card">

            <header class="profile-header">

                <div class="brand-box">

                    <img
                        src="../assets/main_logo.jpeg"
                        alt="Neolife Wellness Center"
                    >

                    <div class="brand-text">
                        <h1>Complete Doctor Profile</h1>
                        <p>
                            Add your professional details before accessing
                            the doctor dashboard.
                        </p>
                    </div>

                </div>

                <div class="header-icon">
                    <i class="fa-solid fa-user-doctor"></i>
                </div>

            </header>

            <div class="profile-content">

                <div
                    id="messageBox"
                    class="message"
                ></div>

                <form id="doctorProfileForm">

                    <div class="form-grid">

                        <div class="form-group">

                            <label for="qualification">
                                Qualification
                                <span class="required">*</span>
                            </label>

                            <input
                                type="text"
                                id="qualification"
                                class="form-control"
                                placeholder="Example: BAMS, MD (Ayu)"
                                required
                            >

                        </div>

                        <div class="form-group">

                            <label for="specialization">
                                Specialization
                                <span class="required">*</span>
                            </label>

                            <input
                                type="text"
                                id="specialization"
                                class="form-control"
                                placeholder="Example: Ayurveda and Panchakarma"
                                required
                            >

                        </div>

                        <div class="form-group">

                            <label for="experience">
                                Experience in years
                                <span class="required">*</span>
                            </label>

                            <input
                                type="number"
                                id="experience"
                                class="form-control"
                                min="0"
                                max="70"
                                placeholder="Example: 18"
                                required
                            >

                        </div>

                        <div class="form-group">

                            <label for="registrationNumber">
                                Registration Number
                                <span class="required">*</span>
                            </label>

                            <input
                                type="text"
                                id="registrationNumber"
                                class="form-control"
                                placeholder="Enter registration number"
                                required
                            >

                        </div>

                        <div class="form-group full-width">

                            <label for="imageUrl">
                                Profile Image URL
                            </label>

                            <input
                                type="url"
                                id="imageUrl"
                                class="form-control"
                                placeholder="https://example.com/doctor.jpg"
                            >

                            <p class="help-text">
                                You may leave this blank and add the image later.
                            </p>

                        </div>

                        <div class="form-group full-width">

                            <label for="about">
                                About Doctor
                                <span class="required">*</span>
                            </label>

                            <textarea
                                id="about"
                                class="form-control"
                                placeholder="Write a short professional introduction..."
                                required
                            ></textarea>

                        </div>

                    </div>

                    <div class="action-row">

                        <button
                            type="button"
                            class="btn btn-secondary"
                            onclick="logoutDoctor()"
                        >
                            <i class="fa-solid fa-right-from-bracket"></i>
                            Logout
                        </button>

                        <button
                            type="submit"
                            id="submitBtn"
                            class="btn btn-primary"
                        >
                            <i class="fa-solid fa-floppy-disk"></i>
                            Complete Profile
                        </button>

                    </div>

                </form>

            </div>

        </section>

    </main>

    <script>
        const API_BASE_URL = "http://localhost:8085";

        const doctorProfileForm =
            document.getElementById("doctorProfileForm");

        const submitBtn =
            document.getElementById("submitBtn");

        const messageBox =
            document.getElementById("messageBox");


        document.addEventListener(
            "DOMContentLoaded",
            function () {

                const token =
                    localStorage.getItem("token");

                const role =
                    localStorage.getItem("role");

                if (!token) {
                    window.location.href =
                        "../patient/login.html";
                    return;
                }

                if (role !== "DOCTOR") {
                    alert(
                        "Only doctors can access this page."
                    );

                    redirectByStoredRole(role);
                    return;
                }

                const profileCompleted =
                    localStorage.getItem(
                        "profileCompleted"
                    );

                if (profileCompleted === "true") {
                    window.location.href =
                        "doctor-dashboard.html";
                }
            }
        );


        function showMessage(message, type) {

            messageBox.textContent = message;
            messageBox.className =
                `message ${type}`;

            messageBox.scrollIntoView({
                behavior: "smooth",
                block: "nearest"
            });
        }


        function clearMessage() {

            messageBox.textContent = "";
            messageBox.className = "message";
        }


        async function safelyReadResponse(response) {

            const responseText =
                await response.text();

            if (!responseText) {
                return null;
            }

            try {
                return JSON.parse(responseText);

            } catch (error) {

                console.error(
                    "Invalid JSON response:",
                    responseText
                );

                return {
                    success: false,
                    message: responseText
                };
            }
        }


        doctorProfileForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();
                clearMessage();

                const token =
                    localStorage.getItem("token");

                if (!token) {
                    window.location.href =
                        "../patient/login.html";
                    return;
                }

                const qualification =
                    document
                        .getElementById("qualification")
                        .value
                        .trim();

                const specialization =
                    document
                        .getElementById("specialization")
                        .value
                        .trim();

                const experienceValue =
                    document
                        .getElementById("experience")
                        .value;

                const registrationNumber =
                    document
                        .getElementById(
                            "registrationNumber"
                        )
                        .value
                        .trim();

                const imageUrl =
                    document
                        .getElementById("imageUrl")
                        .value
                        .trim();

                const about =
                    document
                        .getElementById("about")
                        .value
                        .trim();


                if (
                    !qualification ||
                    !specialization ||
                    !experienceValue ||
                    !registrationNumber ||
                    !about
                ) {
                    showMessage(
                        "Please complete all required fields.",
                        "error"
                    );
                    return;
                }


                const experience =
                    Number(experienceValue);

                if (
                    Number.isNaN(experience) ||
                    experience < 0
                ) {
                    showMessage(
                        "Please enter a valid experience value.",
                        "error"
                    );
                    return;
                }


                const requestBody = {
                    qualification,
                    specialization,
                    experience,
                    about,
                    imageUrl: imageUrl || null,
                    registrationNumber
                };


                submitBtn.disabled = true;

                submitBtn.innerHTML =
                    '<i class="fa-solid fa-spinner fa-spin"></i> Saving...';


                try {

                    const response = await fetch(
                        `${API_BASE_URL}/api/doctors/complete-profile`,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json",

                                "Accept":
                                    "application/json",

                                "Authorization":
                                    `Bearer ${token}`
                            },

                            body:
                                JSON.stringify(requestBody)
                        }
                    );


                    const result =
                        await safelyReadResponse(response);


                    if (!response.ok) {

                        if (
                            response.status === 401 ||
                            response.status === 403
                        ) {
                            throw new Error(
                                result?.message ||
                                "Your login session is invalid or expired."
                            );
                        }

                        throw new Error(
                            result?.message ||
                            `Unable to complete profile. Status: ${response.status}`
                        );
                    }


                    if (
                        result &&
                        result.success === false
                    ) {
                        throw new Error(
                            result.message ||
                            "Unable to complete profile."
                        );
                    }


                    localStorage.setItem(
                        "profileCompleted",
                        "true"
                    );


                    showMessage(
                        result?.message ||
                        "Doctor profile completed successfully. Redirecting...",
                        "success"
                    );


                    setTimeout(function () {

                        window.location.href =
                            "doctor-dashboard.html";

                    }, 1500);


                } catch (error) {

                    console.error(
                        "Complete profile error:",
                        error
                    );

                    showMessage(
                        error.message ||
                        "Unable to complete profile.",
                        "error"
                    );


                } finally {

                    submitBtn.disabled = false;

                    submitBtn.innerHTML =
                        '<i class="fa-solid fa-floppy-disk"></i> Complete Profile';
                }
            }
        );


        function logoutDoctor() {

            localStorage.removeItem("token");
            localStorage.removeItem("refreshToken");
            localStorage.removeItem("userId");
            localStorage.removeItem("email");
            localStorage.removeItem("role");
            localStorage.removeItem("profileCompleted");
            localStorage.removeItem("isLoggedIn");

            window.location.href =
                "../patient/login.html";
        }


        function redirectByStoredRole(role) {

            if (role === "ADMIN") {
                window.location.href =
                    "../admin/admin-dashboard.html";

            } else if (
                role === "MEDICAL_STAFF"
            ) {
                window.location.href =
                    "../staff/staff-dashboard.html";

            } else if (
                role === "THERAPIST"
            ) {
                window.location.href =
                    "../therapist/therapist-dashboard.html";

            } else {
                window.location.href =
                    "../patient/profile.html";
            }
        }
    </script>

</body>
</html>
